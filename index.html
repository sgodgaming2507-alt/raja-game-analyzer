<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raja Game Analyzer Pro</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 15px; margin: 0; text-align: center; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; }
        .btn-big { background: #3b82f6; }
        .btn-small { background: #ef4444; }
        button:active { opacity: 0.8; }
        .stats-box { display: flex; justify-content: space-around; margin-top: 15px; font-size: 16px; }
        .history-list { max-height: 150px; overflow-y: auto; margin-top: 15px; text-align: left; font-size: 14px; background: #0f172a; padding: 10px; border-radius: 6px; }
        .history-item { padding: 4px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; }
        .clear-btn { background: #64748b; margin-top: 10px; width: 100%; padding: 10px; }
    </style>
</head>
<body>
    <h2>Raja Analyzer Pro</h2>
    <div class="card">
        <h3>Record Round Outcome</h3>
        <div class="btn-group">
            <button class="btn-big" onclick="recordOutcome('BIG')">BIG</button>
            <button class="btn-small" onclick="recordOutcome('SMALL')">SMALL</button>
        </div>
        
        <div class="stats-box">
            <div>Total: <span id="total">0</span></div>
            <div>Big: <span id="bigCount">0 (0%)</span></div>
            <div>Small: <span id="smallCount">0 (0%)</span></div>
        </div>

        <button class="clear-btn" onclick="clearHistory()">Reset History</button>

        <div class="history-list" id="historyList"></div>
    </div>

    <script>
        let historyData = JSON.parse(localStorage.getItem('game_history')) || [];

        function updateUI() {
            let total = historyData.length;
            let big = historyData.filter(x => x === 'BIG').length;
            let small = historyData.filter(x => x === 'SMALL').length;

            document.getElementById('total').innerText = total;
            document.getElementById('bigCount').innerText = `${big} (${total ? ((big/total)*100).toFixed(1) : 0}%)`;
            document.getElementById('smallCount').innerText = `${small} (${total ? ((small/total)*100).toFixed(1) : 0}%)`;

            let listHTML = '';
            historyData.slice(-10).reverse().forEach((item, index) => {
                listHTML += `<div class="history-item"><span>Round #${total - index}</span> <strong style="color: ${item === 'BIG' ? '#3b82f6' : '#ef4444'}">${item}</strong></div>`;
            });
            document.getElementById('historyList').innerHTML = listHTML;
        }

        function recordOutcome(type) {
            historyData.push(type);
            localStorage.setItem('game_history', JSON.stringify(historyData));
            updateUI();
        }

        function clearHistory() {
            if(confirm("Saari history delete karni hai?")) {
                historyData = [];
                localStorage.removeItem('game_history');
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
